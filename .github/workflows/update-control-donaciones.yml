name: Actualizar control de donaciones

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Generar JSON desde Excel público
        run: npm run build:data

      - name: Publicar cambios si existen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/control-donaciones.json data/control-donaciones-meta.json
          if git diff --cached --quiet; then
            echo "No hay cambios en los datos."
          else
            git commit -m "Actualizar datos de donaciones"
            git push
          fi
